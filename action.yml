name: Warden Dependency Audit
description: Verify Node.js dependency capabilities match the committed warden.lock.json

inputs:
  working-directory:
    description: Directory containing warden.lock.json (default: repo root)
    required: false
    default: '.'
  json:
    description: Output machine-readable JSON result (true/false)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Warden
      run: npm install -g warden-sandbox
      shell: bash

    - name: Verify dependency capabilities
      run: |
        if [ "${{ inputs.json }}" = "true" ]; then
          warden verify --dir "${{ inputs.working-directory }}" --json
        else
          warden verify --dir "${{ inputs.working-directory }}"
        fi
      shell: bash
